name: VAML 0.2 Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Privacy lint
        run: npm run privacy

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Agent pair demo
        run: npm run demo

      - name: Autonomous Agent dialogue demo
        run: npm run demo:agents

      - name: Acoustic frame demo
        run: npm run demo:audio
