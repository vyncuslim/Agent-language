name: VAML 0.2 Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Privacy lint
        run: npm run privacy

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Agent pair demo
        run: npm run demo
